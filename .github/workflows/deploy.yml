name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host cpanel
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 30
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          EOF
          sed -i 's/^          //' ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload frontend build
        run: |
          rsync -avz --delete \
            --exclude='.htaccess' \
            client/dist/ \
            cpanel:${{ secrets.FRONTEND_PATH }}/

      - name: Upload backend files
        run: |
          rsync -avz \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            server/ \
            cpanel:${{ secrets.BACKEND_PATH }}/

      - name: Update backend
        run: |
          ssh cpanel "cd ${{ secrets.BACKEND_PATH }} && php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction && php artisan migrate --force && php artisan optimize:clear"
